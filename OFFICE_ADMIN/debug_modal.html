<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Debug - PIMS</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link href="assets/css/loading-states.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #F7F3F3 0%, #C1EAF2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .debug-section {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .debug-result {
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }
        .debug-success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .debug-error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .debug-warning {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
        }
        .test-button {
            margin: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">
            <i class="bi bi-bug-fill text-primary"></i> 
            Modal Debug Tool
        </h1>
        
        <div class="debug-section">
            <h3><i class="bi bi-search"></i> Modal Diagnosis</h3>
            <div class="mb-3">
                <button class="btn btn-primary test-button" onclick="checkModal()">
                    <i class="bi bi-eye"></i> Check Modal Elements
                </button>
                <button class="btn btn-success test-button" onclick="testModalShow()">
                    <i class="bi bi-play"></i> Test Modal Show
                </button>
                <button class="btn btn-warning test-button" onclick="testModalHide()">
                    <i class="bi bi-stop"></i> Test Modal Hide
                </button>
                <button class="btn btn-info test-button" onclick="checkBootstrap()">
                    <i class="bi bi-bootstrap"></i> Check Bootstrap
                </button>
            </div>
            <div id="debugResults"></div>
        </div>
        
        <!-- Test Modal (Copy from requests.php) -->
        <div class="modal fade" id="testModal" tabindex="-1">
            <div class="modal-dialog modal-lg modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title">
                            <i class="bi bi-plus-circle d-none d-md-inline"></i> 
                            <span class="d-md-none">Test Modal</span>
                            <span class="d-none d-md-inline">Test Modal</span>
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p>This is a test modal to debug the new request modal issue.</p>
                        <form>
                            <div class="mb-3 form-field-enhanced">
                                <label class="form-label">Test Field</label>
                                <input type="text" class="form-control" placeholder="Test input...">
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary interactive-button" data-bs-dismiss="modal">
                            <i class="bi bi-x-circle"></i> Cancel
                        </button>
                        <button type="button" class="btn btn-primary interactive-button">
                            <i class="bi bi-check"></i> Test Button
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Loading States JS -->
    <script src="assets/js/loading-interactions.js"></script>
    
    <script>
        function addDebugResult(message, type = 'info') {
            const resultsDiv = document.getElementById('debugResults');
            const resultDiv = document.createElement('div');
            resultDiv.className = `debug-result debug-${type}`;
            resultDiv.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            resultsDiv.appendChild(resultDiv);
        }

        function checkModal() {
            const modal = document.getElementById('testModal');
            const trigger = document.querySelector('[data-bs-target="#testModal"]');
            
            if (modal) {
                addDebugResult('✅ Modal element found', 'success');
                addDebugResult(`Modal ID: ${modal.id}`, 'info');
                addDebugResult(`Modal classes: ${modal.className}`, 'info');
            } else {
                addDebugResult('❌ Modal element NOT found', 'error');
            }
            
            if (trigger) {
                addDebugResult('✅ Modal trigger found', 'success');
                addDebugResult(`Trigger data-bs-target: ${trigger.dataset.bsTarget}`, 'info');
                addDebugResult(`Trigger classes: ${trigger.className}`, 'info');
            } else {
                addDebugResult('❌ Modal trigger NOT found', 'error');
            }
        }

        function testModalShow() {
            try {
                const modal = new bootstrap.Modal(document.getElementById('testModal'));
                if (modal) {
                    modal.show();
                    addDebugResult('✅ Modal show() called successfully', 'success');
                    setTimeout(() => {
                        if (modal._isShown) {
                            addDebugResult('✅ Modal is visible', 'success');
                        } else {
                            addDebugResult('⚠️ Modal may not be visible', 'warning');
                        }
                    }, 500);
                } else {
                    addDebugResult('❌ Failed to create modal instance', 'error');
                }
            } catch (error) {
                addDebugResult(`❌ Error showing modal: ${error.message}`, 'error');
            }
        }

        function testModalHide() {
            try {
                const modal = bootstrap.Modal.getInstance(document.getElementById('testModal'));
                if (modal) {
                    modal.hide();
                    addDebugResult('✅ Modal hide() called successfully', 'success');
                }
            } catch (error) {
                addDebugResult(`❌ Error hiding modal: ${error.message}`, 'error');
            }
        }

        function checkBootstrap() {
            if (typeof bootstrap !== 'undefined') {
                addDebugResult('✅ Bootstrap is loaded', 'success');
                addDebugResult(`Bootstrap version: ${bootstrap.VERSION || 'Unknown'}`, 'info');
                
                if (typeof bootstrap.Modal !== 'undefined') {
                    addDebugResult('✅ Bootstrap Modal component is available', 'success');
                } else {
                    addDebugResult('❌ Bootstrap Modal component NOT available', 'error');
                }
            } else {
                addDebugResult('❌ Bootstrap is NOT loaded', 'error');
            }
        }

        // Auto-check on page load
        document.addEventListener('DOMContentLoaded', function() {
            addDebugResult('🔍 Starting automatic diagnosis...', 'info');
            
            // Check if loading framework is loaded
            if (typeof loadingManager !== 'undefined') {
                addDebugResult('✅ LoadingManager is available', 'success');
            } else {
                addDebugResult('❌ LoadingManager NOT found', 'error');
            }
            
            // Check Bootstrap
            checkBootstrap();
            
            // Check modal elements
            checkModal();
            
            // Test modal functionality
            setTimeout(() => {
                testModalShow();
            }, 1000);
        });
    </script>
</body>
</html>
