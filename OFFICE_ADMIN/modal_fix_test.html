<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Fix Test - PIMS</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #F7F3F3 0%, #C1EAF2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .test-section {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .debug-info {
            background: #e3f2fd;
            border: 1px solid #c3e6ff;
            border-radius: 8px;
            padding: 1rem;
            margin: 1rem 0;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .success { color: #155724; }
        .error { color: #dc3545; }
        .warning { color: #856404; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">
            <i class="bi bi-tools text-primary"></i> 
            Modal Fix Test
        </h1>
        
        <div class="test-section">
            <h3><i class="bi bi-bug"></i> Modal Backdrop Issue Fix</h3>
            <p>This page tests the fix for multiple modal backdrops appearing.</p>
            
            <div class="mb-3">
                <button class="btn btn-primary me-2" onclick="testOriginalMethod()">
                    <i class="bi bi-play"></i> Test Original Method
                </button>
                <button class="btn btn-success me-2" onclick="testFixedMethod()">
                    <i class="bi bi-check"></i> Test Fixed Method
                </button>
                <button class="btn btn-warning me-2" onclick="cleanupBackdrops()">
                    <i class="bi bi-trash"></i> Clean Backdrops
                </button>
                <button class="btn btn-info" onclick="checkModalState()">
                    <i class="bi bi-search"></i> Check Modal State
                </button>
            </div>
            
            <div id="debugInfo" class="debug-info">
                <div>Click test buttons to debug modal behavior</div>
            </div>
        </div>
        
        <!-- Test Modal -->
        <div class="modal fade" id="testModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title">Test Modal</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p>This is a test modal to verify the backdrop fix works.</p>
                        <div class="mb-3">
                            <label class="form-label">Test Input</label>
                            <input type="text" class="form-control" placeholder="Type something...">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary">Test Button</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let modalInstance = null;
        
        function addDebugInfo(message, type = 'info') {
            const debugDiv = document.getElementById('debugInfo');
            const timestamp = new Date().toLocaleTimeString();
            const messageDiv = document.createElement('div');
            messageDiv.className = type;
            messageDiv.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
            debugDiv.appendChild(messageDiv);
        }
        
        function countBackdrops() {
            const backdrops = document.querySelectorAll('.modal-backdrop');
            return backdrops.length;
        }
        
        function cleanupBackdrops() {
            const backdrops = document.querySelectorAll('.modal-backdrop');
            const count = backdrops.length;
            
            addDebugInfo(`Found ${count} backdrops to clean up...`, 'warning');
            
            backdrops.forEach((backdrop, index) => {
                if (backdrop.parentNode) {
                    backdrop.parentNode.removeChild(backdrop);
                    addDebugInfo(`Removed backdrop ${index + 1}`, 'success');
                }
            });
            
            const remaining = countBackdrops();
            addDebugInfo(`${remaining} backdrops remaining`, remaining === 0 ? 'success' : 'warning');
        }
        
        function checkModalState() {
            const modal = document.getElementById('testModal');
            const backdrops = countBackdrops();
            const instance = bootstrap.Modal.getInstance(modal);
            
            addDebugInfo(`Modal element exists: ${!!modal}`, 'info');
            addDebugInfo(`Bootstrap instance exists: ${!!instance}`, 'info');
            addDebugInfo(`Current backdrop count: ${backdrops}`, 'info');
            addDebugInfo(`Modal classes: ${modal ? modal.className : 'null'}`, 'info');
            
            if (modal) {
                const isVisible = modal.classList.contains('show');
                addDebugInfo(`Modal is visible: ${isVisible}`, isVisible ? 'success' : 'warning');
            }
        }
        
        function testOriginalMethod() {
            addDebugInfo('Testing original Bootstrap method...', 'info');
            try {
                if (modalInstance) {
                    modalInstance.hide();
                }
                modalInstance = new bootstrap.Modal(document.getElementById('testModal'));
                modalInstance.show();
                addDebugInfo('Original method: Modal created and shown', 'success');
            } catch (error) {
                addDebugInfo(`Original method error: ${error.message}`, 'error');
            }
        }
        
        function testFixedMethod() {
            addDebugInfo('Testing fixed method with cleanup...', 'info');
            
            // Clean up first
            cleanupBackdrops();
            
            try {
                if (modalInstance) {
                    modalInstance.hide();
                }
                
                // Small delay to ensure cleanup
                setTimeout(() => {
                    modalInstance = new bootstrap.Modal(document.getElementById('testModal'));
                    modalInstance.show();
                    addDebugInfo('Fixed method: Modal created and shown after cleanup', 'success');
                }, 100);
            } catch (error) {
                addDebugInfo(`Fixed method error: ${error.message}`, 'error');
            }
        }
        
        // Auto-check on page load
        document.addEventListener('DOMContentLoaded', function() {
            addDebugInfo('Page loaded - ready for testing', 'success');
            checkModalState();
        });
        
        // Monitor backdrop changes
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.type === 'childList') {
                    const addedNodes = Array.from(mutation.addedNodes);
                    const backdrops = addedNodes.filter(node => 
                        node.nodeType === 1 && node.classList && node.classList.contains('modal-backdrop')
                    );
                    
                    if (backdrops.length > 1) {
                        addDebugInfo(`Warning: ${backdrops.length} backdrops added at once!`, 'error');
                    }
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: false
        });
    </script>
</body>
</html>
