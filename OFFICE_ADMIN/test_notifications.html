<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Functions Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-4">
        <h2>Notification Functions Test</h2>
        
        <div class="card mb-3">
            <div class="card-header">
                <h5>Test JavaScript Functions</h5>
            </div>
            <div class="card-body">
                <div class="d-flex gap-2 mb-3">
                    <button class="btn btn-primary" onclick="testMarkAsRead()">
                        <i class="bi bi-check2"></i> Test markAsRead
                    </button>
                    <button class="btn btn-success" onclick="testMarkAllAsRead()">
                        <i class="bi bi-check2-all"></i> Test markAllAsRead
                    </button>
                    <button class="btn btn-danger" onclick="testClearAllNotifications()">
                        <i class="bi bi-trash3"></i> Test clearAllNotifications
                    </button>
                </div>
                
                <div id="test-results" class="alert alert-info">
                    Click buttons above to test functions...
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h5>Function Definitions Check</h5>
            </div>
            <div class="card-body">
                <div id="function-check">
                    Checking function definitions...
                </div>
            </div>
        </div>
    </div>

    <script>
    function testMarkAsRead() {
        const results = document.getElementById('test-results');
        try {
            if (typeof markAsRead === 'function') {
                results.innerHTML = '<div class="alert alert-success">✓ markAsRead function exists and is callable</div>';
                console.log('✓ markAsRead function test passed');
            } else {
                results.innerHTML = '<div class="alert alert-danger">✗ markAsRead function not found</div>';
                console.error('✗ markAsRead function test failed');
            }
        } catch (error) {
            results.innerHTML = '<div class="alert alert-danger">✗ Error testing markAsRead: ' + error.message + '</div>';
            console.error('✗ Error testing markAsRead:', error);
        }
    }
    
    function testMarkAllAsRead() {
        const results = document.getElementById('test-results');
        try {
            if (typeof markAllAsRead === 'function') {
                results.innerHTML = '<div class="alert alert-success">✓ markAllAsRead function exists and is callable</div>';
                console.log('✓ markAllAsRead function test passed');
            } else {
                results.innerHTML = '<div class="alert alert-danger">✗ markAllAsRead function not found</div>';
                console.error('✗ markAllAsRead function test failed');
            }
        } catch (error) {
            results.innerHTML = '<div class="alert alert-danger">✗ Error testing markAllAsRead: ' + error.message + '</div>';
            console.error('✗ Error testing markAllAsRead:', error);
        }
    }
    
    function testClearAllNotifications() {
        const results = document.getElementById('test-results');
        try {
            if (typeof clearAllNotifications === 'function') {
                results.innerHTML = '<div class="alert alert-success">✓ clearAllNotifications function exists and is callable</div>';
                console.log('✓ clearAllNotifications function test passed');
            } else {
                results.innerHTML = '<div class="alert alert-danger">✗ clearAllNotifications function not found</div>';
                console.error('✗ clearAllNotifications function test failed');
            }
        } catch (error) {
            results.innerHTML = '<div class="alert alert-danger">✗ Error testing clearAllNotifications: ' + error.message + '</div>';
            console.error('✗ Error testing clearAllNotifications:', error);
        }
    }
    
    // Check function definitions on load
    document.addEventListener('DOMContentLoaded', function() {
        const functionCheck = document.getElementById('function-check');
        const functions = [
            'markAsRead',
            'markAllAsRead', 
            'clearAllNotifications',
            'deleteNotification',
            'updateNotificationBadge',
            'quickApproveRequest'
        ];
        
        let html = '<ul class="list-unstyled">';
        functions.forEach(funcName => {
            if (typeof window[funcName] === 'function') {
                html += `<li class="text-success">✓ ${funcName} - Function exists</li>`;
            } else {
                html += `<li class="text-danger">✗ ${funcName} - Function missing</li>`;
            }
        });
        html += '</ul>';
        
        functionCheck.innerHTML = html;
        
        console.log('=== Function Definition Check ===');
        functions.forEach(funcName => {
            console.log(`${funcName}:`, typeof window[funcName] === 'function' ? '✓' : '✗');
        });
    });
    
    // Mock the notification functions for testing
    function markAsRead(notificationId) {
        console.log('markAsRead called with ID:', notificationId);
        return Promise.resolve({success: true});
    }
    
    function markAllAsRead() {
        console.log('markAllAsRead called');
        return Promise.resolve({success: true});
    }
    
    function clearAllNotifications() {
        console.log('clearAllNotifications called');
        return Promise.resolve({success: true});
    }
    
    function deleteNotification(notificationId) {
        console.log('deleteNotification called with ID:', notificationId);
        return Promise.resolve({success: true});
    }
    
    function updateNotificationBadge() {
        console.log('updateNotificationBadge called');
        return Promise.resolve({success: true});
    }
    
    function quickApproveRequest(requestId) {
        console.log('quickApproveRequest called with ID:', requestId);
        return Promise.resolve({success: true});
    }
    </script>
</body>
</html>
